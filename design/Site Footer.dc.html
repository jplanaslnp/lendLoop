<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="max-width:{{ L.maxW }};margin:{{ L.margin }};box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#2F4636">
  <div style="background:#FAFBF8;border:1px solid rgba(47,70,54,.07);border-radius:{{ L.radius }};padding:{{ L.pad }};box-shadow:0 1px 2px rgba(47,70,54,.04)">
    <div style="display:grid;grid-template-columns:{{ L.cols }};gap:{{ L.gap }};align-items:start">
      <div style="display:flex;flex-direction:column;gap:14px;padding-right:{{ L.brandPadR }};border-right:{{ L.brandBorder }};min-width:0">
        <a href="Explore.dc.html" style="display:flex;align-items:center;gap:10px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#7040A0" stroke="#7040A0" stroke-width="1.2" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
          <span style="font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#5A2D8C;white-space:nowrap">Share your tool</span>
        </a>
        <p style="margin:0;font-size:{{ L.tag }};line-height:1.5;color:#4F6355;text-wrap:pretty;max-width:320px">A little sharing makes our neighbourhood a better place.</p>
      </div>
      <div style="display:grid;grid-template-columns:{{ L.linkCols }};gap:{{ L.linkGap }};min-width:0">
        <nav aria-label="Explore" style="display:flex;flex-direction:column;gap:12px">
          <span style="font-size:16px;font-weight:800;color:#2F4636">Explore</span>
          <a href="Explore.dc.html" style="font-size:15px;color:#3E5444" style-hover="color:#7040A0">Browse tools</a>
          <a href="Explore.dc.html" style="font-size:15px;color:#3E5444" style-hover="color:#7040A0">Categories</a>
        </nav>
        <nav aria-label="Community" style="display:flex;flex-direction:column;gap:12px">
          <span style="font-size:16px;font-weight:800;color:#2F4636">Community</span>
          <a href="#" style="font-size:15px;color:#3E5444" style-hover="color:#7040A0">How it works</a>
          <a href="#" style="font-size:15px;color:#3E5444" style-hover="color:#7040A0">Community guidelines</a>
        </nav>
        <nav aria-label="Help" style="display:flex;flex-direction:column;gap:12px">
          <span style="font-size:16px;font-weight:800;color:#2F4636">Help</span>
          <a href="#" style="font-size:15px;color:#3E5444" style-hover="color:#7040A0">Contact us</a>
          <a href="#" style="font-size:15px;color:#3E5444" style-hover="color:#7040A0">FAQs</a>
        </nav>
      </div>
    </div>
    <div style="height:1px;background:rgba(47,70,54,.12);margin:{{ L.divider }}"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:#4F6355">
      <span>© 2026 Share your tool</span>
      <div style="display:flex;align-items:center;gap:12px">
        <a href="#" style="color:#3E5444" style-hover="color:#7040A0">Privacy Policy</a>
        <span style="width:4px;height:4px;border-radius:50%;background:#8A988E"></span>
        <a href="#" style="color:#3E5444" style-hover="color:#7040A0">Terms of Service</a>
      </div>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;360px&quot;}}">
class Component extends DCLogic {
  state = { w: (typeof window !== 'undefined' && window.innerWidth) || 1440 };
  componentDidMount() { this._rs = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this._rs); this._rs(); }
  componentWillUnmount() { window.removeEventListener('resize', this._rs); }
  renderVals() {
    const w = this.state.w, mobile = w < 760, mid = w < 1100;
    return { L: {
      maxW: '1440px', margin: mobile ? '40px 0 0' : '64px auto 0',
      radius: mobile ? '20px' : '24px', pad: mobile ? '24px 20px' : (mid ? '36px 32px 28px' : '44px 56px 32px'),
      cols: mobile || mid ? 'minmax(0,1fr)' : 'minmax(0,0.9fr) minmax(0,2fr)', gap: mobile ? '24px' : '40px',
      brandPadR: mobile || mid ? '0' : '40px', brandBorder: mobile || mid ? 'none' : '1px solid rgba(47,70,54,.12)',
      tag: mobile ? '15px' : '17px',
      linkCols: mobile ? 'repeat(2,minmax(0,1fr))' : 'repeat(3,minmax(0,1fr))', linkGap: mobile ? '22px 16px' : '24px',
      divider: mobile ? '22px 0 16px' : '32px 0 20px',
    } };
  }
}
</script>
</body>
</html>
