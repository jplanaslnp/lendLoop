<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ backdrop }}" style="position:fixed;inset:0;z-index:100;background:rgba(31,46,36,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:{{ L.align }};justify-content:center;padding:{{ L.outerPad }};box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
    <div onClick="{{ stop }}" role="dialog" aria-modal="true" aria-label="{{ title }}" style="position:relative;width:100%;max-width:{{ L.maxW }};height:{{ L.h }};max-height:{{ L.maxH }};overflow-y:auto;box-sizing:border-box;background:#FAFBF8;border-radius:{{ L.radius }};padding:{{ L.pad }};box-shadow:0 30px 80px -20px rgba(31,46,36,.5);color:#2F4636">
      <button onClick="{{ close }}" aria-label="Close" style="position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(47,70,54,.1);background:#FFFFFF;color:#2F4636;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#F0F4EC">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
      </button>

      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="display:flex;align-items:center;gap:8px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#7040A0" stroke="#7040A0" stroke-width="1.2" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
          <span style="font-size:18px;font-weight:800;letter-spacing:-0.02em;color:#5A2D8C">Share your tool</span>
        </div>
        <h2 style="margin:18px 0 0;font-size:{{ L.title }};line-height:1.1;font-weight:800;letter-spacing:-0.02em;color:#2F4636">{{ title }}</h2>
        <p style="margin:8px 0 0;font-size:15.5px;color:#4F6355">{{ subtitle }}</p>
      </div>

      <div role="tablist" style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:22px;padding:4px;border-radius:999px;background:#FFFFFF;border:1px solid rgba(47,70,54,.12)">
        <button role="tab" aria-selected="{{ tabs.in.on }}" onClick="{{ toSignIn }}" style="height:44px;border:none;border-radius:999px;background:{{ tabs.in.bg }};color:{{ tabs.in.fg }};font-size:15px;font-weight:{{ tabs.in.fw }};cursor:pointer;transition:background .15s">Sign in</button>
        <button role="tab" aria-selected="{{ tabs.up.on }}" onClick="{{ toSignUp }}" style="height:44px;border:none;border-radius:999px;background:{{ tabs.up.bg }};color:{{ tabs.up.fg }};font-size:15px;font-weight:{{ tabs.up.fw }};cursor:pointer;transition:background .15s">Create account</button>
      </div>

      <sc-if value="{{ isIn }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ submitIn }}" novalidate="" style="display:flex;flex-direction:column;gap:16px;margin-top:22px">
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:700">Email address
            <div style="position:relative">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556A5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:15px;top:50%;margin-top:-9px;pointer-events:none"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3.5 6.5 8.5 6.5 8.5-6.5"></path></svg>
              <input type="email" autocomplete="email" value="{{ f.email }}" onChange="{{ on.email }}" placeholder="you@example.com" style="width:100%;box-sizing:border-box;height:50px;padding:0 14px 0 44px;border-radius:12px;border:1px solid {{ e.email.bd }};background:#FFFFFF;color:#2F4636;font-size:15.5px;font-family:inherit;outline:none" style-focus="border-color:#7040A0;box-shadow:0 0 0 4px rgba(112,64,160,.12)">
            </div>
            <sc-if value="{{ e.email.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.email.msg }}</span></sc-if>
          </label>
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:700">Password
            <div style="position:relative">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556A5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:15px;top:50%;margin-top:-9px;pointer-events:none"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg>
              <input type="{{ pwType }}" autocomplete="current-password" value="{{ f.password }}" onChange="{{ on.password }}" placeholder="Enter your password" style="width:100%;box-sizing:border-box;height:50px;padding:0 48px 0 44px;border-radius:12px;border:1px solid {{ e.password.bd }};background:#FFFFFF;color:#2F4636;font-size:15.5px;font-family:inherit;outline:none" style-focus="border-color:#7040A0;box-shadow:0 0 0 4px rgba(112,64,160,.12)">
              <button type="button" onClick="{{ togglePw }}" aria-label="Show password" style="position:absolute;right:4px;top:3px;width:44px;height:44px;border:none;background:none;color:#556A5B;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
            </div>
            <sc-if value="{{ e.password.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.password.msg }}</span></sc-if>
          </label>
          <div style="display:flex;justify-content:flex-end;margin-top:-6px"><button type="button" onClick="{{ forgot }}" style="padding:4px 0;border:none;background:none;color:#7040A0;font-size:14.5px;font-weight:700;cursor:pointer">Forgot your password?</button></div>
          <sc-if value="{{ note }}" hint-placeholder-val="{{ false }}"><div style="padding:12px 14px;border-radius:12px;background:#E1F0DA;color:#2C6B34;font-size:14px;font-weight:600">{{ note }}</div></sc-if>
          <button type="submit" style="min-height:54px;border:none;border-radius:999px;background:#7040A0;color:#FFFFFF;font-size:16.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -6px rgba(112,64,160,.45)" style-hover="background:#5F3290">Sign in</button>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;font-size:14px;color:#556A5B"><span style="height:1px;background:rgba(47,70,54,.14)"></span>Or continue with<span style="height:1px;background:rgba(47,70,54,.14)"></span></div>
          <button type="button" onClick="{{ google }}" style="display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;border-radius:999px;border:1px solid rgba(47,70,54,.16);background:#FFFFFF;color:#2F4636;font-size:16px;font-weight:600;cursor:pointer" style-hover="background:#F7F9F4">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"></path><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"></path><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.7V6.6H1.4a12 12 0 0 0 0 10.8z"></path><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"></path></svg>Continue with Google</button>
          <p style="margin:4px 0 0;text-align:center;font-size:15px;color:#4F6355">Don't have an account? <button type="button" onClick="{{ toSignUp }}" style="padding:0;border:none;background:none;color:#7040A0;font-size:15px;font-weight:700;cursor:pointer">Create account</button></p>
        </form>
      </sc-if>

      <sc-if value="{{ isUp }}" hint-placeholder-val="{{ false }}">
        <form onSubmit="{{ submitUp }}" novalidate="" style="display:flex;flex-direction:column;gap:16px;margin-top:22px">
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:700">Full name
            <div style="position:relative">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556A5B" stroke-width="1.8" stroke-linecap="round" style="position:absolute;left:15px;top:50%;margin-top:-9px;pointer-events:none"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c1-4 4-6 7.5-6s6.5 2 7.5 6"></path></svg>
              <input autocomplete="name" value="{{ f.name }}" onChange="{{ on.name }}" placeholder="e.g. Jaume Planas" style="width:100%;box-sizing:border-box;height:50px;padding:0 14px 0 44px;border-radius:12px;border:1px solid {{ e.name.bd }};background:#FFFFFF;color:#2F4636;font-size:15.5px;font-family:inherit;outline:none" style-focus="border-color:#7040A0;box-shadow:0 0 0 4px rgba(112,64,160,.12)">
            </div>
            <sc-if value="{{ e.name.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.name.msg }}</span></sc-if>
          </label>
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:700">Email address
            <div style="position:relative">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556A5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:15px;top:50%;margin-top:-9px;pointer-events:none"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3.5 6.5 8.5 6.5 8.5-6.5"></path></svg>
              <input type="email" autocomplete="email" value="{{ f.email }}" onChange="{{ on.email }}" placeholder="you@example.com" style="width:100%;box-sizing:border-box;height:50px;padding:0 14px 0 44px;border-radius:12px;border:1px solid {{ e.email.bd }};background:#FFFFFF;color:#2F4636;font-size:15.5px;font-family:inherit;outline:none" style-focus="border-color:#7040A0;box-shadow:0 0 0 4px rgba(112,64,160,.12)">
            </div>
            <sc-if value="{{ e.email.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.email.msg }}</span></sc-if>
          </label>
          <div style="display:grid;grid-template-columns:{{ L.pwCols }};gap:16px">
            <label style="display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:700;min-width:0">Password
              <div style="position:relative">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556A5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:15px;top:50%;margin-top:-9px;pointer-events:none"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg>
                <input type="{{ pwType }}" autocomplete="new-password" value="{{ f.password }}" onChange="{{ on.password }}" placeholder="8+ characters" style="width:100%;box-sizing:border-box;height:50px;padding:0 48px 0 44px;border-radius:12px;border:1px solid {{ e.password.bd }};background:#FFFFFF;color:#2F4636;font-size:15.5px;font-family:inherit;outline:none" style-focus="border-color:#7040A0;box-shadow:0 0 0 4px rgba(112,64,160,.12)">
                <button type="button" onClick="{{ togglePw }}" aria-label="Show password" style="position:absolute;right:4px;top:3px;width:44px;height:44px;border:none;background:none;color:#556A5B;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
              </div>
              <sc-if value="{{ e.password.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.password.msg }}</span></sc-if>
            </label>
            <label style="display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:700;min-width:0">Confirm password
              <div style="position:relative">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556A5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:15px;top:50%;margin-top:-9px;pointer-events:none"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg>
                <input type="{{ pwType }}" autocomplete="new-password" value="{{ f.confirm }}" onChange="{{ on.confirm }}" placeholder="Repeat password" style="width:100%;box-sizing:border-box;height:50px;padding:0 14px 0 44px;border-radius:12px;border:1px solid {{ e.confirm.bd }};background:#FFFFFF;color:#2F4636;font-size:15.5px;font-family:inherit;outline:none" style-focus="border-color:#7040A0;box-shadow:0 0 0 4px rgba(112,64,160,.12)">
              </div>
              <sc-if value="{{ e.confirm.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.confirm.msg }}</span></sc-if>
            </label>
          </div>
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14.5px;font-weight:700">Your address
            <div style="position:relative">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#556A5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:15px;top:50%;margin-top:-9px;pointer-events:none"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
              <input autocomplete="street-address" value="{{ f.address }}" onChange="{{ on.address }}" placeholder="Building, floor, neighbourhood — e.g. Building A, 3rd floor, Gent" style="width:100%;box-sizing:border-box;height:50px;padding:0 14px 0 44px;border-radius:12px;border:1px solid {{ e.address.bd }};background:#FFFFFF;color:#2F4636;font-size:15.5px;font-family:inherit;outline:none" style-focus="border-color:#7040A0;box-shadow:0 0 0 4px rgba(112,64,160,.12)">
            </div>
            <sc-if value="{{ e.address.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.address.msg }}</span></sc-if>
          </label>
          <div style="aspect-ratio:3/1;max-height:150px;width:100%;border-radius:14px;border:1px solid rgba(47,70,54,.1);background-image:url(img/map.jpg);background-size:cover;background-position:center;opacity:{{ mapOp }};transition:opacity .2s"></div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:-6px;padding:12px 14px;border-radius:12px;background:#F3ECFA;color:#2F4636;font-size:14px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7040A0" stroke-width="2" stroke-linecap="round" style="flex:none"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8v.5"></path></svg><span>We use your address to connect you with nearby neighbors.</span></div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="display:flex;align-items:flex-start;gap:12px;font-size:14.5px;line-height:1.45;color:#3E5444;cursor:pointer">
              <input type="checkbox" checked="{{ f.terms }}" onChange="{{ on.terms }}" style="flex:none;width:22px;height:22px;margin:0;accent-color:#7040A0;cursor:pointer">
              <span>I accept the <a href="#" onClick="{{ stopLink }}" style="color:#7040A0;font-weight:700">Terms of Service</a> and <a href="#" onClick="{{ stopLink }}" style="color:#7040A0;font-weight:700">Privacy Policy</a>.</span>
            </label>
            <sc-if value="{{ e.terms.msg }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:600;color:#B3261E">{{ e.terms.msg }}</span></sc-if>
          </div>
          <button type="submit" style="min-height:54px;border:none;border-radius:999px;background:#7040A0;color:#FFFFFF;font-size:16.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -6px rgba(112,64,160,.45)" style-hover="background:#5F3290">Create account</button>
          <p style="margin:0;text-align:center;font-size:15px;color:#4F6355">Already have an account? <button type="button" onClick="{{ toSignIn }}" style="padding:0;border:none;background:none;color:#7040A0;font-size:15px;font-weight:700;cursor:pointer">Sign in</button></p>
        </form>
      </sc-if>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;900px&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;signin&quot;,&quot;signup&quot;],&quot;default&quot;:&quot;signin&quot;,&quot;tsType&quot;:&quot;'signin'|'signup'&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSuccess&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const EMPTY = { name:'', email:'', password:'', confirm:'', address:'', terms:false };
const okEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());

class Component extends DCLogic {
  state = { mode:null, f:{ ...EMPTY }, tried:false, showPw:false, note:null, w:(typeof window !== 'undefined' && window.innerWidth) || 1440 };
  componentDidMount() {
    this._key = e => { if (e.key === 'Escape' && this.props.open) this.close(); };
    this._rs = () => this.setState({ w: window.innerWidth });
    window.addEventListener('keydown', this._key); window.addEventListener('resize', this._rs);
    this.syncScroll();
  }
  componentDidUpdate(prev) {
    if (prev.open !== this.props.open) {
      this.syncScroll();
      if (this.props.open) this.setState({ mode: this.props.mode || 'signin', tried:false, note:null });
    }
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); window.removeEventListener('resize', this._rs); document.body.style.overflow = ''; }
  syncScroll() { document.body.style.overflow = this.props.open ? 'hidden' : ''; }
  close() { this.props.onClose && this.props.onClose(); }
  errors(mode) {
    const f = this.state.f, e = {};
    if (!okEmail(f.email)) e.email = f.email.trim() ? 'Enter a valid email address.' : 'Enter your email address.';
    if (mode === 'signin') { if (!f.password) e.password = 'Enter your password.'; return e; }
    if (!f.name.trim()) e.name = 'Enter your full name.';
    if (f.password.length < 8) e.password = 'Use at least 8 characters.';
    if (!f.confirm || f.confirm !== f.password) e.confirm = 'Passwords don’t match.';
    if (f.address.trim().length < 5) e.address = 'Add your building, floor and neighbourhood.';
    if (!f.terms) e.terms = 'Please accept the Terms of Service and Privacy Policy.';
    return e;
  }
  submit(ev, mode) {
    ev && ev.preventDefault();
    if (Object.keys(this.errors(mode)).length) return this.setState({ tried:true });
    this.setState({ f:{ ...EMPTY }, tried:false, note:null });
    this.props.onSuccess && this.props.onSuccess();
  }
  renderVals() {
    const s = this.state;
    const mode = s.mode || this.props.mode || 'signin';
    const mobile = s.w < 640;
    const L = {
      align: mobile ? 'stretch' : 'center', outerPad: mobile ? '0' : '24px',
      maxW: mobile ? '100%' : '540px', h: mobile ? '100%' : 'auto', maxH: mobile ? '100%' : 'calc(100vh - 48px)',
      radius: mobile ? '0' : '26px', pad: mobile ? '64px 20px calc(28px + env(safe-area-inset-bottom))' : '40px 44px 36px',
      title: mobile ? '28px' : '34px', pwCols: mobile ? 'minmax(0,1fr)' : 'repeat(2,minmax(0,1fr))',
    };
    const errs = s.tried ? this.errors(mode) : {};
    const e = {};
    ['name','email','password','confirm','address','terms'].forEach(k => { e[k] = { msg: errs[k] || null, bd: errs[k] ? '#D93A2B' : 'rgba(47,70,54,.16)' }; });
    const tab = on => on ? { on, bg:'#7040A0', fg:'#FFFFFF', fw:700 } : { on, bg:'transparent', fg:'#2F4636', fw:600 };
    const set = k => ev => { const v = k === 'terms' ? ev.target.checked : ev.target.value; this.setState(st => ({ f:{ ...st.f, [k]: v } })); };
    const sw = m => () => this.setState({ mode:m, tried:false, note:null });
    return {
      open: !!this.props.open, L, e, f: s.f, note: s.note,
      isIn: mode === 'signin', isUp: mode === 'signup',
      title: mode === 'signin' ? 'Welcome back' : 'Create your account',
      subtitle: mode === 'signin' ? 'Your neighborhood, sharing together.' : 'Join your neighborhood and start sharing.',
      tabs: { in: tab(mode === 'signin'), up: tab(mode === 'signup') },
      pwType: s.showPw ? 'text' : 'password', mapOp: s.f.address.trim().length >= 5 ? 1 : 0.7,
      on: { name:set('name'), email:set('email'), password:set('password'), confirm:set('confirm'), address:set('address'), terms:set('terms') },
      toSignIn: sw('signin'), toSignUp: sw('signup'),
      togglePw: () => this.setState(st => ({ showPw: !st.showPw })),
      forgot: () => okEmail(s.f.email) ? this.setState({ note:`We sent a reset link to ${s.f.email.trim()}.`, tried:false }) : this.setState({ tried:true, note:null }),
      submitIn: ev => this.submit(ev, 'signin'), submitUp: ev => this.submit(ev, 'signup'),
      google: () => { this.props.onSuccess && this.props.onSuccess(); },
      close: () => this.close(), backdrop: () => this.close(),
      stop: ev => ev.stopPropagation(), stopLink: ev => ev.preventDefault(),
    };
  }
}
</script>
